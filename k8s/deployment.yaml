apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pagamentos

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-pagamentos

  template:
    metadata:
      labels:
        app: api-pagamentos

    spec:
      automountServiceAccountToken: false

      containers:
        - name: api-pagamentos
          image: ghcr.io/daniellarf/api-pagamentos:1.0

          ports:
            - containerPort: 3000

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"